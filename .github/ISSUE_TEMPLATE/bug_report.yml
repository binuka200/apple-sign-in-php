name: Bug report
description: Report reproducible incorrect behavior in the package.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include real Apple tokens, authorization codes, client secrets, private keys, or personal data.
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.3.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide sanitized code and the steps required to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized exception details or logs if useful.
